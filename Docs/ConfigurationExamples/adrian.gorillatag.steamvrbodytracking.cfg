## EXAMPLE of the file BepInEx generates on first launch (defaults shown).
## Real location: Gorilla Tag\BepInEx\config\adrian.gorillatag.steamvrbodytracking.cfg
## Plugin GUID: adrian.gorillatag.steamvrbodytracking

[Avatar]

## Installs the Harmony patch on GorillaIKMgr.CopyInput that lets trackers pose the local gorilla visually. Requires restart. Disable to run tracker-only.
# Setting type: Boolean
# Default value: true
Enable Avatar Integration Patch = true

[Debug]

## Extra diagnostic log lines.
# Setting type: Boolean
# Default value: false
Verbose Logging = false

[Menu]

## Keyboard key (Unity Input System Key name, e.g. F8, F9, Backquote) that opens/closes the tracker menu.
# Setting type: String
# Default value: F8
Toggle Key = F8

## Controller gesture (held) that opens/closes the tracker menu in VR. Secondary = B/Y on Quest/Index, menu button region on Vive wands.
# Setting type: VRMenuGesture
# Default value: BothSecondaryButtons
# Acceptable values: BothSecondaryButtons, LeftSecondaryButton, RightSecondaryButton, LeftPrimaryAndSecondary, Disabled
VR Gesture = BothSecondaryButtons

## How long the VR gesture must be held.
# Setting type: Single
# Default value: 0.6
# Acceptable value range: From 0.1 to 3
VR Gesture Hold Seconds = 0.6

[Tracking]

## How often SteamVR devices are re-scanned for connects/disconnects. Pose sampling is every frame regardless.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0.25 to 5
Discovery Interval Seconds = 1

## If the game is NOT running through its OpenVR XR loader (e.g. OpenXR), open a background OpenVR session to read trackers. Never used when the game's own OpenVR session exists.
# Setting type: Boolean
# Default value: true
Allow Standalone OpenVR Session = true

## Auto: verify at runtime whether the camera parent is the tracking origin; otherwise anchor on the headset. Force one mode only for troubleshooting.
# Setting type: CoordinateModeSetting
# Default value: Auto
# Acceptable values: Auto, HmdAnchor, TrackingOrigin
Coordinate Mode = Auto
